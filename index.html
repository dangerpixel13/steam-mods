<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Copiando código...</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            text-align: center;
            background: #1b2838; /* Azul Steam */
            color: #c7d5e0;
            padding-top: 15vh;
            margin: 0;
        }
        .container { max-width: 500px; margin: 0 auto; padding: 20px; }
        .success { color: #66c0f4; font-size: 28px; font-weight: bold; margin-bottom: 15px; }
        .text { color: #8f98a0; font-size: 16px; line-height: 1.5; }
        .countdown { font-size: 14px; color: #5a6a75; margin-top: 25px; }
    </style>
</head>
<body>
    <div class="container">
        <p id="msg">Leyendo código...</p>
    </div>

    <script>
        // 1. LEER EL CÓDIGO EN BRUTO EVITANDO EL BUG DEL SIGNO MAS (+)
        function obtenerCodigoDeURL() {
            const busqueda = window.location.search;
            if (!busqueda.includes('c=')) return "Ningún código proporcionado";
            
            // Dividimos la URL en el parámetro 'c=' y tomamos todo lo que va después
            let fragmento = busqueda.split('c=')[1];
            
            // Si hay más parámetros separados por '&', nos quedamos solo con el primero
            if (fragmento.includes('&')) {
                fragmento = fragmento.split('&')[0];
            }
            
            // Decodificamos los espacios (%20) pero manteniendo intactos los signos más (+)
            return decodeURIComponent(fragmento);
        }

        const textoACopiar = obtenerCodigoDeURL();

        function iniciarCopiado() {
            if (textoACopiar === "Ningún código proporcionado") {
                document.getElementById("msg").innerHTML = `<div style="color:#ff4d4d; font-size:20px;">Falta el código en la URL.</div>`;
                return;
            }

            // 2. COPIAR AL PORTAPAPELES (Sin pedir permisos en HTTPS)
            navigator.clipboard.writeText(textoACopiar).then(() => {
                document.getElementById("msg").innerHTML = `
                    <div class="success">¡Copiado con éxito! ✅</div>
                    <div class="text">El código ya está listo para usar en tu juego.</div>
                    <div id="timer" class="countdown">Esta ventana intentará cerrarse en 3 segundos...</div>
                `;
                comenzarCuentaAtras(3);
            }).catch(err => {
                // Copia manual de emergencia si el navegador del usuario es muy antiguo
                document.getElementById("msg").innerHTML = `
                    <div style="color: #ff4d4d; font-size: 20px; font-weight:bold;">Error al copiar automáticamente ❌</div>
                    <div class="text" style="margin-top:10px;">Por favor, cópialo manualmente de aquí abajo:</div>
                    <textarea style="width:100%; height:60px; margin-top:15px; background:#101822; color:#fff; border:1px solid #3a5573; padding:5px; font-family:monospace;" readonly>${textoACopiar}</textarea>
                `;
            });
        }

        // 3. CUENTA ATRÁS PARA VOLVER A STEAM
        function comenzarCuentaAtras(segundos) {
            let tiempo = segundos;
            const intervalo = setInterval(() => {
                tiempo--;
                if (tiempo <= 0) {
                    clearInterval(intervalo);
                    document.getElementById("timer").innerHTML = "Ya puedes cerrar esta pestaña y volver a Steam.";
                    window.close(); 
                } else {
                    document.getElementById("timer").innerHTML = `Esta ventana intentará cerrarse en ${tiempo} segundos...`;
                }
            }, 1000);
        }

        window.addEventListener('DOMContentLoaded', iniciarCopiado);
    </script>
</body>
</html>
