<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Copiando código...</title>

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            text-align: center;
            background: #1b2838;
            color: #c7d5e0;
            padding-top: 15vh;
            margin: 0;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
            padding: 20px;
        }

        .success {
            color: #66c0f4;
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .error {
            color: #ff4d4d;
            font-size: 20px;
            font-weight: bold;
        }

        .text {
            color: #8f98a0;
            font-size: 16px;
            line-height: 1.5;
        }

        .countdown {
            font-size: 14px;
            color: #5a6a75;
            margin-top: 25px;
        }

        .code {
            width: 100%;
            height: 80px;
            margin-top: 15px;
            box-sizing: border-box;
            background: #101822;
            color: #fff;
            border: 1px solid #3a5573;
            padding: 10px;
            font-family: monospace;
            font-size: 14px;
            resize: none;
        }

        .copy-button {
            margin-top: 15px;
            padding: 12px 25px;
            border: none;
            border-radius: 3px;
            background: #1a9fff;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .copy-button:hover {
            background: #66c0f4;
        }

        .copy-button:active {
            transform: scale(0.98);
        }
    </style>
</head>

<body>

<div class="container">
    <p id="msg">Leyendo código...</p>
</div>

<script>

    // ---------------------------------------------------------
    // LEER EL CÓDIGO DE LA URL
    // ---------------------------------------------------------

    function obtenerCodigoDeURL() {

        const busqueda = window.location.search;

        if (!busqueda.includes('c=')) {
            return null;
        }

        let fragmento = busqueda.split('c=')[1];

        if (fragmento.includes('&')) {
            fragmento = fragmento.split('&')[0];
        }

        // decodeURIComponent mantiene los "+" como "+"
        return decodeURIComponent(fragmento);
    }


    // ---------------------------------------------------------
    // COPIAR USANDO CLIPBOARD API
    // ---------------------------------------------------------

    async function copiarConClipboard(texto) {

        if (!navigator.clipboard) {
            throw new Error("Clipboard API no disponible");
        }

        await navigator.clipboard.writeText(texto);
    }


    // ---------------------------------------------------------
    // FALLBACK PARA NAVEGADORES ANTIGUOS
    // ---------------------------------------------------------

    function copiarConFallback(texto) {

        const textarea = document.createElement("textarea");

        textarea.value = texto;

        textarea.style.position = "fixed";
        textarea.style.left = "-9999px";
        textarea.style.top = "0";

        document.body.appendChild(textarea);

        textarea.focus();
        textarea.select();

        let correcto = false;

        try {
            correcto = document.execCommand("copy");
        } catch (e) {
            correcto = false;
        }

        document.body.removeChild(textarea);

        if (!correcto) {
            throw new Error("No se pudo copiar");
        }
    }


    // ---------------------------------------------------------
    // MOSTRAR BOTÓN MANUAL
    // ---------------------------------------------------------

    function mostrarBotonCopiar(texto) {

        document.getElementById("msg").innerHTML = `

            <div class="text">
                El navegador no permitió copiar automáticamente.
            </div>

            <textarea
                id="codigo"
                class="code"
                readonly
            ></textarea>

            <button id="copiarBtn" class="copy-button">
                📋 Copiar código
            </button>

            <div id="estado" class="countdown"></div>
            
            <div id="timer" class="countdown">
                </div>
        `;

        document.getElementById("codigo").value = texto;

        document
            .getElementById("copiarBtn")
            .addEventListener("click", async function () {

                const estado = document.getElementById("estado");

                try {

                    // Primero intentamos Clipboard API
                    await copiarConClipboard(texto);

                    estado.textContent = "¡Código copiado! ✅";
                    comenzarCuentaAtras(3);

                } catch (e) {

                    // Después intentamos el método antiguo
                    try {

                        copiarConFallback(texto);

                        estado.textContent = "¡Código copiado! ✅";
                        comenzarCuentaAtras(3);

                    } catch (e2) {

                        estado.textContent =
                            "No se pudo copiar automáticamente. Selecciona el texto y cópialo manualmente.";

                        const textarea = document.getElementById("codigo");

                        textarea.focus();
                        textarea.select();
                    }
                }
            });
    }


    // ---------------------------------------------------------
    // COPIADO AUTOMÁTICO
    // ---------------------------------------------------------

    async function iniciarCopiado() {

        const textoACopiar = obtenerCodigoDeURL();

        if (!textoACopiar) {

            document.getElementById("msg").innerHTML = `
                <div class="error">
                    Falta el código en la URL.
                </div>
            `;

            return;
        }


        // Intentamos copiar automáticamente

        try {

            await copiarConClipboard(textoACopiar);

            document.getElementById("msg").innerHTML = `

                <div class="success">
                    ¡Copiado con éxito! ✅
                </div>

                <div class="text">
                    El código ya está listo para usar en tu juego.
                </div>

                <div id="timer" class="countdown">
                    Esta ventana intentará cerrarse en 3 segundos...
                </div>
            `;

            comenzarCuentaAtras(3);

        } catch (e) {

            // Si el navegador lo bloquea,
            // mostramos el botón de copiado.

            mostrarBotonCopiar(textoACopiar);
        }
    }


    // ---------------------------------------------------------
    // CUENTA ATRÁS
    // ---------------------------------------------------------

    function comenzarCuentaAtras(segundos) {

        let tiempo = segundos;

        const intervalo = setInterval(() => {

            tiempo--;

            if (tiempo <= 0) {

                clearInterval(intervalo);

                document.getElementById("timer").innerHTML =
                    "Ya puedes cerrar esta pestaña y volver a Steam.";

                // window.close() solo funciona en determinadas
                // circunstancias, por ejemplo si la ventana
                // fue abierta mediante JavaScript.

                window.close();

            } else {

                document.getElementById("timer").innerHTML =
                    `Esta ventana intentará cerrarse en ${tiempo} segundos...`;
            }

        }, 1000);
    }


    // ---------------------------------------------------------
    // INICIAR
    // ---------------------------------------------------------

    window.addEventListener("DOMContentLoaded", iniciarCopiado);

</script>

</body>
</html>
